<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NUVYRA Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 14 46 28 32 42 18 28Z' fill='%237C6AF7'/%3E%3Ccircle cx='10.5' cy='53.5' r='5' fill='%235EA0FF'/%3E%3Crect x='38' y='20' width='22' height='8' rx='4' fill='%238B7BFF' transform='rotate(-16 38 24)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/600.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--disp:'Manrope',sans-serif;--body:'Inter',sans-serif;--ez:cubic-bezier(.22,.61,.2,1);--ezo:cubic-bezier(.16,1,.3,1);--sbw:224px}
:root[data-theme=dark]{--bg:#090B13;--bg2:#0D101B;--surf:#11141F;--surf2:#171B2A;--raise:#1B2033;--bd:rgba(150,164,220,.11);--bd2:rgba(150,164,220,.26);--tx:#E9ECF8;--mut:#98A0BE;--fnt:#626A8C;--pri:#7C6AF7;--acc:#4D9FFF;--ok:#34D399;--warn:#FBBF24;--err:#F87171;--grad:linear-gradient(120deg,#4D9FFF,#7C6AF7 55%,#A99CFF);--gbtn:linear-gradient(135deg,#8A79FF,#5B46E8);--glow:0 8px 26px rgba(124,106,247,.3);--shadow:0 16px 40px rgba(2,3,10,.5);--chip:rgba(124,106,247,.14);color-scheme:dark}
:root[data-theme=light]{--bg:#F4F5FA;--bg2:#EDEEF6;--surf:#fff;--surf2:#F1F2F9;--raise:#fff;--bd:rgba(22,26,58,.09);--bd2:rgba(22,26,58,.22);--tx:#151830;--mut:#5A607E;--fnt:#8B90AB;--pri:#4F39F6;--acc:#1D6FE0;--ok:#0EA36B;--warn:#D9930D;--err:#DE4560;--grad:linear-gradient(120deg,#1D6FE0,#4F39F6 55%,#8E7BFF);--gbtn:linear-gradient(135deg,#6A56FF,#3E2BD1);--glow:0 8px 24px rgba(79,57,246,.24);--shadow:0 14px 36px rgba(28,30,66,.12);--chip:rgba(79,57,246,.1);color-scheme:light}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:13.5px;line-height:1.55;transition:background .35s,color .35s}
.disp{font-family:var(--disp);letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex-shrink:0}
.mut{color:var(--mut)}.fnt{color:var(--fnt)}
::selection{background:var(--pri);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:.2s var(--ez);white-space:nowrap;border:1px solid transparent}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;pointer-events:none}
.btn-p{background:var(--gbtn);color:#fff;box-shadow:var(--glow)}.btn-p:hover{transform:translateY(-1px)}
.btn-g{border-color:var(--bd2);background:var(--surf2)}.btn-g:hover{border-color:var(--pri)}
.btn-d{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
.btn-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn-xs{padding:5px 10px;font-size:12px;border-radius:8px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);display:grid;place-items:center;background:var(--surf);color:var(--mut);transition:.2s}
.iconbtn:hover{color:var(--tx);border-color:var(--bd2)}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:700}
.b-new{background:var(--chip);color:var(--pri)}.b-rev{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}.b-acc{background:color-mix(in srgb,#A99CFF 15%,transparent);color:#A99CFF}.b-prog{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}.b-wait{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}.b-done{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.b-can{background:color-mix(in srgb,var(--err) 13%,transparent);color:var(--err)}
.b-pay-p{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}.b-pay-s{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}.b-pay-c{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.b-pay-n{background:var(--surf2);color:var(--fnt)}
.b-dl-od{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}.b-dl-ur{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}.b-dl-sn{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc)}
.b-pri-h{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.b-pri-u{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
/* shell — centered, not stretched */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:var(--sbw) 1fr}
#maincol{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.shellmax{max-width:1440px;width:100%;margin-inline:auto;padding:22px 30px}
#sidebar{position:sticky;top:0;height:100vh;background:var(--bg2);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:0 9px}
.brand svg{width:30px;height:30px}
.brand .wm{font-family:var(--disp);font-weight:700;font-size:14.5px;letter-spacing:.18em;display:block}
.brand small{font-size:8.5px;letter-spacing:.26em;color:var(--fnt);font-weight:700}
.nav{margin-top:20px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav b{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mut);transition:.18s;text-align:start;position:relative}
.nav b:hover{color:var(--tx);background:var(--surf2)}
.nav b.on{color:var(--tx);background:var(--chip)}
.nav b.on::before{content:"";position:absolute;inset-inline-start:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad)}
.nav .cnt{margin-inline-start:auto;font-size:10px;font-weight:800;background:var(--pri);color:#fff;padding:1px 7px;border-radius:99px}
.sb-foot{padding:11px 9px 0;border-top:1px solid var(--bd);display:flex;align-items:center;gap:9px}
.sb-foot .av{width:31px;height:31px;border-radius:9px;background:var(--gbtn);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.sb-foot .inf{flex:1;min-width:0}
.sb-foot .inf b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot .inf span{font-size:10.5px;color:var(--fnt)}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:11px 30px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
#tbTitle{font-family:var(--disp);font-weight:700;font-size:16px}
.tacts{margin-inline-start:auto;display:flex;gap:7px;align-items:center}
#netPill{display:none;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--err) 13%,transparent);color:var(--err)}
#netPill.on{display:inline-flex}
#rtDot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fnt);font-weight:700}
#rtDot i{width:7px;height:7px;border-radius:50%;background:var(--fnt)}
#rtDot.live{color:var(--ok)}#rtDot.live i{background:var(--ok);animation:pl 2.2s infinite}
#rtDot.warn{color:var(--warn)}#rtDot.warn i{background:var(--warn)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.4)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
#menuBtn{display:none}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px;margin-bottom:18px}
.metric{padding:15px;border-radius:13px;background:var(--surf);border:1px solid var(--bd);position:relative;overflow:hidden;animation:fin .45s var(--ezo) both}
.metric .mv{font-family:var(--disp);font-weight:700;font-size:23px;line-height:1.2;margin-top:6px}
.metric .ml{font-size:11.5px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:7px}
.metric .ml .ic{width:13px;height:13px;color:var(--pri)}
.metric.hl{background:var(--gbtn);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.metric.hl .ml{color:rgba(255,255,255,.85)}.metric.hl .ml .ic{color:#fff}
.metric::after{content:"";position:absolute;inset-inline-end:-20px;top:-20px;width:72px;height:72px;border-radius:50%;background:var(--chip);opacity:.5}
.metric.hl::after{background:rgba(255,255,255,.13)}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:13px}
.card.pad{padding:17px}
.card h3{font-size:13.5px;font-family:var(--disp)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1080px){.grid2,.grid2e{grid-template-columns:1fr}}
.skel{position:relative;overflow:hidden;background:var(--surf2);border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tx) 6%,transparent),transparent);animation:sh 1.3s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--fnt);text-align:start;padding:9px 11px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl td{padding:11px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover{background:var(--surf2)}
.ono{font-family:var(--disp);font-weight:700;font-size:12.5px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tin{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--surf);font-size:12.5px}
.tin input,.tin select{background:none;border:0;outline:none;color:var(--tx);font-size:12.5px;min-width:0}
.tin input{width:160px}
.tin:focus-within{border-color:var(--pri)}
.empty{padding:44px 22px;text-align:center;color:var(--fnt)}
.empty .em{width:62px;height:62px;margin:0 auto 15px;border-radius:18px;background:var(--surf2);border:1px dashed var(--bd2);display:grid;place-items:center}
.empty b{display:block;color:var(--mut);font-size:13.5px;margin-bottom:4px}
.empty span{font-size:12px}
.pgn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px 0;font-size:12px;color:var(--mut)}
/* drawer */
#dwrap{position:fixed;inset:0;z-index:120;visibility:hidden}
#dwrap.open{visibility:visible}
#dbg{position:absolute;inset:0;background:rgba(4,6,14,.55);backdrop-filter:blur(3px);opacity:0;transition:.3s}
#dwrap.open #dbg{opacity:1}
#drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(640px,100%);background:var(--bg);border-inline-start:1px solid var(--bd);transform:translateX(102%);transition:transform .4s var(--ezo);display:flex;flex-direction:column;overflow:hidden}
[dir=rtl] #drawer{transform:translateX(-102%)}
#dwrap.open #drawer{transform:none!important}
.dhead{padding:15px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--bg2)}
.dbody{flex:1;overflow-y:auto;padding:18px 20px 110px;display:flex;flex-direction:column;gap:13px}
.dfoot{position:absolute;bottom:0;inset-inline:0;padding:11px 20px calc(11px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--bd);display:flex;gap:9px;flex-wrap:wrap}
.dsec{background:var(--surf);border:1px solid var(--bd);border-radius:13px;padding:16px}
.dsec>h4{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--fnt);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 15px;font-size:13px}
.kv b{color:var(--fnt);font-weight:500;font-size:12px}
.notebox{padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.6}
.note-int{background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent)}
.note-cus{background:var(--surf2);border:1px solid var(--bd)}
.tline{position:relative;padding-inline-start:18px}
.tline::before{content:"";position:absolute;inset-inline-start:4px;top:5px;bottom:5px;width:1.5px;background:var(--bd2)}
.tl-i{position:relative;padding-bottom:13px}
.tl-i::before{content:"";position:absolute;inset-inline-start:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surf);border:2.5px solid var(--pri)}
.tl-i b{font-size:12.5px}.tl-i span{display:block;font-size:11px;color:var(--fnt)}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--surf2);transition:.2s;font-size:13px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--pri)}
.fld textarea{resize:vertical;min-height:64px}
.frow2{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:1px solid var(--bd);background:var(--surf2);margin-bottom:7px}
.fti{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:8.5px;font-weight:800;color:#fff;flex-shrink:0}
.ft-pdf{background:#E5484D}.ft-img{background:#30A46C}.ft-doc{background:#3E63DD}.ft-ppt{background:#E5793A}.ft-zip{background:#8E4EC6}.ft-oth{background:var(--fnt)}
/* toasts + notif */
#toasts{position:fixed;bottom:18px;inset-inline-end:18px;z-index:280;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{display:flex;gap:10px;padding:12px 15px;border-radius:12px;background:var(--raise);border:1px solid var(--bd2);box-shadow:var(--shadow);animation:tin .35s var(--ezo);font-size:12.5px;align-items:flex-start}
.toast.out{animation:tout .3s var(--ez) forwards}
.toast .ti{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.t-ok .ti{background:var(--ok)}.t-err .ti{background:var(--err)}.t-info .ti{background:var(--pri)}.t-warn .ti{background:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(26px)}}
#notifStack{position:fixed;top:16px;inset-inline-end:16px;z-index:290;display:flex;flex-direction:column;gap:9px;width:min(340px,calc(100vw - 32px))}
.ncard{background:var(--raise);border:1px solid var(--bd2);border-radius:14px;padding:14px;box-shadow:var(--shadow);animation:nin .5s var(--ezo);position:relative;overflow:hidden}
.ncard::before{content:"";position:absolute;top:0;inset-inline:0;height:2.5px;background:var(--grad)}
@keyframes nin{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
.ncard .nh{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--pri);margin-bottom:7px}
.ncard b{font-size:13.5px;display:block}
.ncard .nm{font-size:12px;color:var(--mut);margin-top:2px}
.ncard .na{display:flex;gap:7px;margin-top:11px}
/* modal */
#modal{position:fixed;inset:0;z-index:260;display:none;place-items:center;background:rgba(4,6,14,.6);backdrop-filter:blur(3px);padding:18px}
#modal.open{display:grid}
.mbox{width:min(430px,94vw);background:var(--raise);border:1px solid var(--bd2);border-radius:16px;padding:23px;box-shadow:var(--shadow);animation:pin .28s var(--ezo)}
@keyframes pin{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
.mbox h3{font-size:16px;margin-bottom:7px;font-family:var(--disp)}
.mbox p{color:var(--mut);font-size:13px;margin-bottom:17px}
.macts{display:flex;gap:9px;justify-content:flex-end}
/* login */
#loginView{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(800px 500px at 80% -10%,color-mix(in srgb,var(--pri) 14%,transparent),transparent 70%)}
.lcard{width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1fr;border-radius:22px;overflow:hidden;border:1px solid var(--bd2);box-shadow:var(--shadow);background:var(--surf)}
@media(max-width:780px){.lcard{grid-template-columns:1fr}.lbrand{display:none}}
.lbrand{padding:38px;background:var(--bg2);display:flex;flex-direction:column;justify-content:space-between;gap:26px;border-inline-end:1px solid var(--bd)}
.lbrand svg{width:48px;height:48px}
.lbrand h1{font-size:24px;line-height:1.3}
.lbrand p{color:var(--mut);font-size:13px;margin-top:10px}
.lform{padding:38px;display:flex;flex-direction:column;justify-content:center}
.lform h2{font-size:20px;margin-bottom:5px;font-family:var(--disp)}
.lform>p{color:var(--mut);font-size:13px;margin-bottom:22px}
.lerr{display:none;padding:10px 13px;border-radius:10px;background:color-mix(in srgb,var(--err) 11%,transparent);border:1px solid color-mix(in srgb,var(--err) 35%,transparent);color:var(--err);font-size:12.5px;margin-bottom:12px}
.lerr.on{display:block}
/* misc */
.seg{display:inline-flex;background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.seg b{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;transition:.18s;white-space:nowrap}
.seg b.on{background:var(--raise);color:var(--tx)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer}
.sw input{display:none}
.sw i{width:38px;height:22px;border-radius:99px;background:var(--surf2);border:1px solid var(--bd);position:relative;transition:.22s;flex-shrink:0}
.sw i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.22s}
.sw input:checked+i{background:var(--gbtn);border-color:transparent}
.sw input:checked+i::after{inset-inline-start:18px;background:#fff}
.chbar{display:flex;align-items:flex-end;gap:4px;height:104px}
.chbar i{flex:1;border-radius:4px 4px 2px 2px;background:var(--grad);opacity:.85;min-height:3px;transform-origin:bottom;animation:bar .6s var(--ezo) both}
@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hbar{display:flex;align-items:center;gap:11px;margin-bottom:10px;font-size:12.5px}
.hbar .hb-l{width:118px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .hb-t{flex:1;height:7px;border-radius:4px;background:var(--surf2);overflow:hidden}
.hbar .hb-t i{display:block;height:100%;background:var(--grad)}
.hbar b{width:28px;text-align:end;font-family:var(--disp)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow .st b{display:block;font-size:13px}.setrow .st span{font-size:12px;color:var(--mut)}
.sts{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.sts i{width:8px;height:8px;border-radius:50%}
.sts.ok{color:var(--ok)}.sts.ok i{background:var(--ok)}
.sts.bad{color:var(--err)}.sts.bad i{background:var(--err)}
.sts.pend{color:var(--warn)}.sts.pend i{background:var(--warn)}
.mcards{display:none;flex-direction:column;gap:9px}
.mcard{padding:13px;border-radius:12px;background:var(--surf);border:1px solid var(--bd)}

/* orders — server pagination */
let oToken=0,qTimer=null;
async function fetchOrdersPage(){
  const tk=++oToken;
  let qy=sb.from("orders").select("*",{count:"exact"});
  if(UI.osvc)qy=qy.eq("service",UI.osvc);
  if(UI.ost)qy=qy.eq("status",UI.ost);
  if(UI.opay)qy=qy.eq("payment_status",UI.opay);
  if(UI.odl==="overdue")qy=qy.lt("deadline",new Date().toISOString().slice(0,10)).not("status","in",'("Completed","Cancelled")');
  else if(UI.odl==="soon"){const d=new Date();const a=new Date(d.getTime()+3*864e5).toISOString().slice(0,10);qy=qy.gte("deadline",d.toISOString().slice(0,10)).lte("deadline",a).not("status","in",'("Completed","Cancelled")')}
  const q=UI.oq.trim().toLowerCase();
  if(q){
    const safe=UI.oq.trim().replace(/[%,()"\\]/g," ");
    const cids=DB.customers.filter(c=>(c.full_name||"").toLowerCase().includes(q)||(c.phone||"").includes(UI.oq.trim())).map(c=>'"'+c.id+'"');
    let ors=`order_number.ilike.%${safe}%`;
    if(cids.length)ors+=`,customer_id.in.(${cids.join(",")})`;
    qy=qy.or(ors);
  }
  const sortMap={newest:["created_at",false],oldest:["created_at",true],dl:["deadline",true],up:["updated_at",false]};
  const[sc,asc]=sortMap[UI.osort]||sortMap.newest;
  qy=qy.order(sc,{ascending:asc,nullsFirst:false}).range((UI.opage-1)*UI.per,UI.opage*UI.per-1);
  const {data,error,count}=await qy;
  if(tk!==oToken)return;
  if(error){console.warn(error);UI._err=true;UI.rows=[];UI.total=0}else{UI._err=false;UI.rows=data||[];UI.total=count||0}
  if(UI.sec==="orders")paintOrders();
}

async function updateOrder(id,patch,evType){
  patch.updated_at=new Date().toISOString();
  const {error}=await sb.from("orders").update(patch).eq("id",id);
  if(error)throw error;
  const o=DB.recent.find(x=>x.id===id);if(o)Object.assign(o,patch);
  if(evType){DB.events.unshift({order_id:id,event_type:evType,created_at:new Date().toISOString()});
    try{await sb.from("order_events").insert({order_id:id,event_type:evType,actor:"admin"})}catch(e){}}
  loadCounts().then(renderNav);
  if(UI.sec==="orders"&&UI.opage===1)fetchOrdersPage();
  return o;
}

function fileRowHTML(f){const ext=(f.file_name||"").split(".").pop().toUpperCase().slice(0,4);
  const cls=/PDF/.test(ext)?"ft-pdf":/JPG|JPEG|PNG|WEBP|GIF/.test(ext)?"ft-img":/DOC|RTF/.test(ext)?"ft-doc":/PPT/.test(ext)?"ft-ppt":/ZIP|RAR/.test(ext)?"ft-zip":"ft-oth";
  const kb=f.file_size>1048576?(f.file_size/1048576).toFixed(1)+" MB":Math.max(1,Math.round((f.file_size||0)/1024))+" KB";
  return`<div class="frow2"><span class="fti ${cls}">${esc(ext)}</span><span style="flex:1;min-width:0"><b style="font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.file_name)}</b><span class="fnt" style="font-size:11px">${kb} · ${f.created_at?ago(f.created_at):""}</span></span>
  <button class="btn btn-g btn-xs" data-viewf="${f.id}">${ic("eye",11)} Preview</button><button class="btn btn-g btn-xs" data-dlf="${f.id}">${ic("down",11)}</button></div>`}
async function fileUrl(f){try{const {data,err}=await sb.storage.from("order-files").createSignedUrl(f.file_path,300);if(!err&&data&&data.signedUrl)return data.signedUrl}catch(e){}
  return sb.storage.from("order-files").getPublicUrl(f.file_path).data.publicUrl}
async function viewFile(f){if(!f)return;const ext=(f.file_name||"").toLowerCase();const isImg=/\.(jpg|jpeg|png|webp|gif)$/.test(ext),isPdf=/\.pdf$/.test(ext);
  modal(`<h3>File preview</h3><p style="word-break:break-all">${esc(f.file_name)}</p><div id="fv"><div class="spin"></div></div><div class="macts" style="margin-top:13px"><button class="btn btn-g" onclick="closeModal()">Close</button><a class="btn btn-p" id="fvDl" target="_blank" rel="noopener">${ic("down",12)} Download</a></div>`);
  try{const u=await fileUrl(f);$("#fvDl").href=u;
    if(isImg)$("#fv").innerHTML=`<img src="${u}" style="width:100%;border-radius:11px;max-height:54vh;object-fit:contain" onerror="this.outerHTML='<div class=empty>Preview unavailable — try downloading.</div>'">`;
    else if(isPdf)$("#fv").innerHTML=`<iframe src="${u}" style="width:100%;height:54vh;border:0;border-radius:11px;background:#fff"></iframe>`;
    else $("#fv").innerHTML=`<div class="empty" style="padding:22px"><b>Preview not available for this type</b></div>`}
  catch(e){$("#fv").innerHTML=`<div class="empty" style="padding:22px"><b>This file couldn't be opened.</b></div>`}}

function contactCustomer(orderId){const o=DB.recent.find(x=>x.id===orderId);if(!o)return;const cu=custOf(o);

/* customers */
function customerRows(){const map=new Map();
  for(const o of DB.recent){const cu=custOf(o);const key=o.customer_id||cu.phone||cu.name;
    if(!map.has(key))map.set(key,{id:o.customer_id,name:cu.name,phone:cu.phone,orders:[],created:(cu.cust&&cu.cust.created_at)||o.created_at});
    const r=map.get(key);r.orders.push(o);if(!r.phone)r.phone=cu.phone;if(r.name==="—")r.name=cu.name}
  for(const c of DB.customers){if(!map.has(c.id))map.set(c.id,{id:c.id,name:c.full_name||"—",phone:c.phone||"",orders:[],created:c.created_at})}
  return[...map.values()].map(r=>{const conf=r.orders.filter(o=>o.payment_status==="Confirmed").reduce((a,o)=>a+num(o.price||o.budget),0);const last=r.orders.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];return{...r,conf,last}})}

let rtStarted=false,noQueue=[],noTimer=null;
function setRT(state){const d=$("#rtDot");d.classList.remove("live","warn");
  if(state==="live"){d.classList.add("live");$("#rtTx").textContent="Realtime"}
  else if(state==="warn"){d.classList.add("warn");$("#rtTx").textContent="Realtime — reconnecting"}}
function startRealtime(){if(!sb||rtStarted)return;rtStarted=true;
  const handleInsert=row=>{if(!row)return;
    if(!DB.recent.some(o=>o.id===row.id))DB.recent.unshift(row);
    const cu=row.service_details&&row.service_details.customer?row.service_details.customer:{};
    noQueue.push({row,name:cu.name||"Customer",svc:svcName(row.service),num:row.order_number||"",price:row.budget||row.price||""});
    clearTimeout(noTimer);noTimer=setTimeout(flushNotifs,900);
    addNotif("order","New order received",`${cu.name||""} · ${svcName(row.service)} · ${row.order_number||""}`,row.id);
    snd.order();loadCounts().then(renderNav);
    if(["dashboard","orders"].includes(UI.sec)){if(UI.sec==="orders"&&UI.opage===1&&!UI.oq&&!UI.osvc&&!UI.ost&&!UI.opay)fetchOrdersPage();else renderSection()}};
  const handleUpdate=row=>{if(!row)return;const i=DB.recent.findIndex(o=>o.id===row.id);if(i>-1)DB.recent[i]=row;else DB.recent.unshift(row);
    if(UI.sec==="orders"&&UI.opage===1)fetchOrdersPage();else if(UI.sec==="dashboard")renderSection();renderNav()};
  try{
    const c1=sb.channel("nv-db-orders")
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"orders"},p=>handleInsert(p.new))
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"orders"},p=>handleUpdate(p.new))
      .subscribe(status=>{if(status==="SUBSCRIBED")setRT("live");else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){setRT("warn");setTimeout(startRealtimeRetry,8000)}});
    sb.channel("nuvyra-live").on("broadcast",{event:"new-order"},({payload})=>{
      if(payload&&payload.orderId){if(!DB.recent.some(o=>o.id===payload.orderId)){/* fetch full row */ sb.from("orders").select("*").eq("id",payload.orderId).maybeSingle().then(({data})=>{if(data)handleInsert(data)})}}
      else if(payload&&!DB.recent.some(o=>o.order_number===payload.orderNumber)){loadRecent().then(()=>renderSection())}
    }).subscribe();
    window._rtChan=c1;
  }catch(e){setRT("warn")}}
function startRealtimeRetry(){try{if(window._rtChan){sb.removeChannel(window._rtChan);rtStarted=false;startRealtime()}}catch(e){}}
function flushNotifs(){const n=noQueue.shift();if(!n)return;const extra=noQueue.length;const stack=$("#notifStack");
  const el=document.createElement("div");el.className="ncard";
  el.innerHTML=`<div class="nh">${ic("zap",11)} New Order Received</div><b>${esc(n.name)}</b><div class="nm">${esc(n.svc)} · ${esc(n.num)}${n.price?` · <b style="color:var(--tx)">${esc(n.price)}</b>`:""} · Just now</div>
  ${extra>0?`<div class="nm" style="color:var(--pri);font-weight:700">+${extra} more new orders</div>`:""}
  <div class="na"><button class="btn btn-p btn-xs" data-v>${ic("eye",11)} View Order</button><button class="btn btn-g btn-xs" data-w>${icf("wa")}</button><button class="btn btn-g btn-xs" data-x>Dismiss</button></div>`;
  stack.appendChild(el);
  const rid=n.row&&n.row.id;const phone=(n.row&&n.row.service_details&&n.row.service_details.customer&&n.row.service_details.customer.phone)||"";
  el.querySelector("[data-v]").addEventListener("click",()=>{if(rid)openOrder(rid);el.remove()});
  el.querySelector("[data-w]").addEventListener("click",()=>window.open(waLink(phone,`Hello, this is NUVYRA regarding your order ${n.num}.`),"_blank"));
  el.querySelector("[data-x]").addEventListener("click",()=>el.remove());
  setTimeout(()=>{el.style.transition="opacity .5s,transform .5s";el.style.opacity="0";el.style.transform="translateY(-10px)";setTimeout(()=>el.remove(),500)},14000);
  if(noQueue.length)noTimer=setTimeout(flushNotifs,700)}
/* auth */
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();
  const btn=$("#lgBtn"),err=$("#loginErr");err.classList.remove("on");btn.disabled=true;btn.textContent="Signing in…";
  try{if(!sb)throw new Error("client");
    const {error}=await sb.auth.signInWithPassword({email:$("#lgEmail").value.trim(),password:$("#lgPass").value});
    if(error)throw error}
  catch(x){console.warn(x);err.textContent="We couldn't sign you in. Check your credentials and try again.";err.classList.add("on")}
  btn.disabled=false;btn.textContent="Enter Command Center"});
$("#lgForgot").addEventListener("click",async()=>{const em=$("#lgEmail").value.trim();if(!em){toast("Please enter your email first.","warn");return}
  try{await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href});toast("Password reset email sent. Check your inbox.","ok")}catch(e){toast("Something went wrong. Please try again.","err")}});
async function doLogout(){try{await sb.auth.signOut()}catch(e){}AUTH.session=null;AUTH.user=null;$("#app").classList.remove("on");$("#loginView").hidden=false;toast("Signed out","info")}
$("#logoutBtn").addEventListener("click",doLogout);
$("#refBtn").addEventListener("click",()=>refreshAll());
window.refreshAll=async function(){if(!AUTH.session)return;toast("Refreshing…","info");await Promise.all([loadStatic(),loadCounts(),loadRecent()]);renderNav();renderSection()};
function enterApp(session){AUTH.session=session;AUTH.user=session.user;
  $("#loginView").hidden=true;$("#app").classList.add("on");
  $("#adminEm").textContent=session.user.email||"—";$("#adminNm").textContent=(session.user.email||"admin").split("@")[0];
  $("#adminAv").textContent=(session.user.email||"A")[0].toUpperCase();
  const h=location.hash.replace("#","");if(NAVS.some(n=>n[0]===h))UI.sec=h;
  $("#tbTitle").textContent=NAVS.find(n=>n[0]===UI.sec)[2];
  $("#vbox").innerHTML=skeleton();renderNav();
  (async()=>{await Promise.all([loadStatic(),loadCounts(),loadRecent()]);renderSection();renderNav();startRealtime()})();
}
/* connectivity */
function paintNet(){$("#netPill").classList.toggle("on",!navigator.onLine)}
addEventListener("offline",paintNet);
addEventListener("online",()=>{paintNet();toast("Connection restored.","ok");refreshAll()});
/* boot */
paintSnd();paintNet();
(async function boot(){
  if(!sb){$("#loginView").hidden=false;const e=$("#loginErr");e.textContent="Supabase client failed to load. Check your connection and refresh.";e.classList.add("on");return}
  try{const {data:{session}}=await sb.auth.getSession();
    if(session)enterApp(session);else $("#loginView").hidden=false;
    sb.auth.onAuthStateChange((_ev,s2)=>{
      if(s2&&!AUTH.session)enterApp(s2);
      else if(!s2&&AUTH.session){AUTH.session=null;AUTH.user=null;$("#app").classList.remove("on");$("#loginView").hidden=false}
      else if(s2){AUTH.session=s2;AUTH.user=s2.user}});
  }catch(e){$("#loginView").hidden=false}
})();
</script>
